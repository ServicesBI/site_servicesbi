<header class="site-header">
    <div class="site-header__inner">
        <a class="site-logo" href="{% url 'pages:home' %}" aria-label="ServicesBI — página inicial">
            Services<span>BI</span>
        </a>

        {% with current_url=request.resolver_match.url_name %}
        <nav class="site-nav" aria-label="Menu principal">
            <a class="{% if current_url == 'home' %}is-active{% endif %}" href="{% url 'pages:home' %}"{% if current_url == 'home' %} aria-current="page"{% endif %}>Início</a>
            <a class="{% if current_url == 'consultoria' %}is-active{% endif %}" href="{% url 'pages:consultoria' %}"{% if current_url == 'consultoria' %} aria-current="page"{% endif %}>Consultoria Financeira</a>
            <a class="{% if current_url == 'powerbi' %}is-active{% endif %}" href="{% url 'pages:powerbi' %}"{% if current_url == 'powerbi' %} aria-current="page"{% endif %}>BI &amp; Dashboards</a>
            <a class="{% if current_url == 'automacoes' %}is-active{% endif %}" href="{% url 'pages:automacoes' %}"{% if current_url == 'automacoes' %} aria-current="page"{% endif %}>Automação &amp; Sistemas</a>
            <a href="{% url 'pages:home' %}#cases">Cases</a>
            <a class="{% if current_url == 'sobre' or current_url == 'curriculo' %}is-active{% endif %}" href="{% url 'pages:sobre' %}"{% if current_url == 'sobre' %} aria-current="page"{% endif %}>Sobre</a>
            <a class="site-nav__cta" href="{{ WA_DIAGNOSTICO }}" target="_blank" rel="noopener noreferrer">Diagnóstico gratuito</a>
        </nav>
        {% endwith %}

        {% include "includes/theme_toggle.html" %}
    </div>
</header>
